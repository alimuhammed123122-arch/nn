<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Final Love Animation</title>
    <style>
      body, html {
        margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%;
      }
      canvas { display: block; touch-action: none; }
      
      /* النص يتناسب استجابةً مع حجم القلب والشاشة تلقائياً */
      #heartText {
        position: absolute; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%);
        color: #f3c0db; 
        font-family: sans-serif; 
        
        /* حجم خط متجاوب يلتزم بأبعاد الشاشة والقلب */
        font-size: clamp(11px, 3.5vmin, 26px); 
        max-width: 35vmin; /* يمنع النص من الخروج عن حدود جوانب القلب */
        
        text-align: center;
        opacity: 0; 
        z-index: 10; 
        pointer-events: none; 
        line-height: 1.4; 
        transition: opacity 1.5s ease-in-out;
        text-shadow: 0 0 10px rgba(255, 20, 147, 0.8), 0 0 20px rgba(255, 20, 147, 0.5);
      }

      /* الزر في الأسفل بشكل منفصل تماماً */
      #navButton {
        position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
        background-color: #ff149100; color: white; border: none; padding: 12px 24px;
        font-size: 16px; font-family: sans-serif; border-radius: 25px; cursor: pointer;
        z-index: 20; box-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
        opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out, background-color 0.3s ease, transform 0.2s ease;
      }
      #navButton:hover {
        background-color: #420825;
        transform: translateX(-50%) scale(1.05);
      }
    </style>
</head>
<body>
    <div id="heartText">كل عام وأنت بخير يا<br>جميلة أبريل وجميلة كل الشهور</div>
    <button id="navButton">🌚</button>
    <canvas id="mainCanvas"></canvas>

    <script>
      const canvas = document.getElementById("mainCanvas");
      const ctx = canvas.getContext("2d");
      const offCanvas = document.createElement("canvas");
      const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

      function resize() {
        width = canvas.width = offCanvas.width = window.innerWidth;
        height = canvas.height = offCanvas.height = window.innerHeight;
      }
      let width, height;
      resize();
      window.addEventListener("resize", resize);

      const rainChars = ["I", "♥", "Y", "O", "U", "L", "O", "V", "E"];
      const fontSize = 14;
      const columns = Math.floor(window.innerWidth / 25);
      let drops = [];
      for (let i = 0; i < columns; i++) {
        drops.push({
          x: i * 25,
          y: Math.random() * window.innerHeight,
          speed: Math.random() * 1.2 + 1.0,
          chars: Array.from({ length: 14 }, () => rainChars[Math.floor(Math.random() * rainChars.length)])
        });
      }

      let particles = [];
      const sequence = ["3", "2", "1", "0", "يو", "YOU", "ARE", "MY", "LOVE", "♥"];
      let step = 0;
      let frameCount = 0;

      class Particle {
        constructor(tx, ty, isHeart = false, side = 0) {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.baseTx = tx; 
          this.baseTy = ty;
          this.tx = tx; 
          this.ty = ty;
          this.ease = 0.05; 
          this.radius = 1.5;
          this.alpha = 0; 
          this.targetAlpha = 1;
          this.isHeart = isHeart;
          this.side = side; 
        }
        update() {
          if (this.isHeart) {
            let pulse = Math.sin(frameCount * 0.06) * 0.04 + 1;
            let cx = width / 2;
            let cy = height / 2;
            this.tx = cx + (this.baseTx - cx) * pulse;
            this.ty = cy + (this.baseTy - cy) * pulse;
          }

          this.x += (this.tx - this.x) * this.ease;
          this.y += (this.ty - this.y) * this.ease;
          this.alpha += (this.targetAlpha - this.alpha) * 0.1;
        }
        draw(ctx, isFinalHeart = false) {
          if (this.alpha < 0.01) return;
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = "#ffffff";
          
          if (isFinalHeart) {
            ctx.shadowColor = "#ff1493";
            ctx.shadowBlur = 15;
          } else {
            ctx.shadowBlur = 0;
          }

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function getTargets(text) {
        offCtx.clearRect(0, 0, width, height);
        let targets = [];

        if (text === "♥") {
          let scale = Math.min(width, height) / 55;
          let cx = width / 2;
          let cy = height / 2;
          for (let t = 0; t <= Math.PI * 2; t += 0.02) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            let side = x < 0 ? -1 : 1;
            targets.push({ x: cx + x * scale, y: cy + y * scale, side: side });
          }
          return targets;
        }

        offCtx.textAlign = "center";
        offCtx.textBaseline = "middle";
        let fSize = Math.min(width, height) * (step > 3 ? 0.18 : 0.3);
        offCtx.fillStyle = "white";
        offCtx.font = `bold ${fSize}px Arial`;
        offCtx.fillText(text, width / 2, height / 2);

        let imgData = offCtx.getImageData(0, 0, width, height).data;
        for (let y = 0; y < height; y += 4) {
          for (let x = 0; x < width; x += 4) {
            if (imgData[(y * width + x) * 4 + 3] > 128) {
              let side = x < width / 2 ? -1 : 1;
              targets.push({ x, y, side });
            }
          }
        }
        return targets;
      }

      function animate() {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.font = `${fontSize}px monospace`;

        drops.forEach(drop => {
          for (let i = 0; i < drop.chars.length; i++) {
            let charY = drop.y + (i * (fontSize + 4));
            
            let alphaFactor = 0.8;
            let topFadeZone = height * 0.2;
            let bottomFadeZone = height * 0.8;

            if (charY < topFadeZone) {
              alphaFactor = 0.8 * (charY / topFadeZone);
            } else if (charY > bottomFadeZone) {
              alphaFactor = 0.8 * ((height - charY) / (height - bottomFadeZone));
            }
            alphaFactor = Math.max(0, Math.min(0.8, alphaFactor));

            ctx.fillStyle = "#ff1493";
            ctx.globalAlpha = alphaFactor;
            ctx.fillText(drop.chars[i], drop.x, charY);
          }

          drop.y += drop.speed;
          if (drop.y > height) {
            drop.y = -300;
            drop.chars = Array.from({ length: 14 }, () => rainChars[Math.floor(Math.random() * rainChars.length)]);
          }
        });
        ctx.restore();

        frameCount++;
        let isFinalStep = (step === sequence.length - 1);
        particles.forEach((p) => { p.update(); p.draw(ctx, isFinalStep); });
        requestAnimationFrame(animate);
      }

      async function runSequence() {
        while (step < sequence.length) {
          let isHeartStep = (sequence[step] === "♥");

          if (step <= 3) {
            let targets = getTargets(sequence[step]);
            particles = targets.map((t) => new Particle(t.x, t.y, isHeartStep, t.side));
            await new Promise((r) => setTimeout(r, 1800));
            particles.forEach((p) => (p.targetAlpha = 0));
            await new Promise((r) => setTimeout(r, 800));
            particles = [];
          } else if (step === 4) {
            particles = Array.from({ length: 600 }, () => new Particle(0, 0, false, 0));
            particles.forEach((p) => {
              p.x = width / 2; p.y = height / 2;
              let angle = Math.random() * Math.PI * 2;
              let dist = Math.random() * 400 + 100;
              p.tx = p.x + Math.cos(angle) * dist;
              p.ty = p.y + Math.sin(angle) * dist;
              p.targetAlpha = 0.5;
            });
            await new Promise((r) => setTimeout(r, 1200));
            step++; continue;
          } else {
            let targets = getTargets(sequence[step]);
            particles.forEach((p, i) => {
              if (i < targets.length) { 
                p.baseTx = targets[i].x; 
                p.baseTy = targets[i].y;
                p.tx = targets[i].x; 
                p.ty = targets[i].y;
                p.isHeart = isHeartStep;
                p.side = targets[i].side;
                p.targetAlpha = 1; 
              } else {
                p.targetAlpha = 0;
              }
            });
            if (isHeartStep) {
              setTimeout(() => { 
                document.getElementById("heartText").style.opacity = 1; 
                let btn = document.getElementById("navButton");
                btn.style.opacity = 1;
                btn.style.pointerEvents = "auto";
              }, 1500);
            }
            if (step === sequence.length - 1) {
              return; 
            }
            await new Promise((r) => setTimeout(r, 2000));
          }
          step++;
        }
      }

      document.getElementById("navButton").addEventListener("click", function() {
        window.location.href = "N.html";
      });

      animate();
      runSequence();
    </script>
</body>
</html>
